<svg width="880" height="460" viewBox="0 0 880 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-bzs" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#66666a" />
    </marker>
  </defs>
  <rect width="880" height="460" fill="#fafaf8" />

  <!-- Row 1: linear bandit -->
  <rect x="30" y="20" width="180" height="46" rx="8" fill="#ffffff" stroke="#d7d6d2" />
  <text x="120" y="48" text-anchor="middle" font-size="12" fill="#222">context x</text>

  <text x="225" y="48" text-anchor="middle" font-size="16" fill="#66666a">·</text>

  <rect x="245" y="20" width="180" height="46" rx="8" fill="#ffffff" stroke="#d7d6d2" />
  <text x="335" y="48" text-anchor="middle" font-size="12" fill="#222">arm weights &#952;</text>

  <text x="450" y="48" text-anchor="middle" font-size="14" fill="#66666a">=</text>

  <rect x="470" y="20" width="220" height="46" rx="8" fill="#eaf0fd" stroke="#1d4ed8" />
  <text x="580" y="48" text-anchor="middle" font-size="12" fill="#1d4ed8">value(x, arm)</text>

  <text x="720" y="48" text-anchor="middle" font-size="11" fill="#66666a">linear bandit</text>

  <!-- Row 2: successor features -->
  <rect x="30" y="100" width="180" height="46" rx="8" fill="#ffffff" stroke="#d7d6d2" />
  <text x="120" y="128" text-anchor="middle" font-size="12" fill="#222">&#968;(s, a)</text>

  <text x="225" y="128" text-anchor="middle" font-size="16" fill="#66666a">·</text>

  <rect x="245" y="100" width="180" height="46" rx="8" fill="#ffffff" stroke="#d7d6d2" />
  <text x="335" y="128" text-anchor="middle" font-size="12" fill="#222">goal weights w_g</text>

  <text x="450" y="128" text-anchor="middle" font-size="14" fill="#66666a">=</text>

  <rect x="470" y="100" width="220" height="46" rx="8" fill="#eaf0fd" stroke="#1d4ed8" />
  <text x="580" y="128" text-anchor="middle" font-size="12" fill="#1d4ed8">Q_g(s, a)</text>

  <text x="720" y="128" text-anchor="middle" font-size="11" fill="#66666a">successor features (RL)</text>

  <!-- Row 3: ZSL classifier -->
  <rect x="30" y="180" width="180" height="46" rx="8" fill="#ffffff" stroke="#d7d6d2" />
  <text x="120" y="208" text-anchor="middle" font-size="12" fill="#222">f(image)</text>

  <text x="225" y="208" text-anchor="middle" font-size="16" fill="#66666a">·</text>

  <rect x="245" y="180" width="180" height="46" rx="8" fill="#ffffff" stroke="#d7d6d2" />
  <text x="335" y="208" text-anchor="middle" font-size="12" fill="#222">g(class)</text>

  <text x="450" y="208" text-anchor="middle" font-size="14" fill="#66666a">=</text>

  <rect x="470" y="180" width="220" height="46" rx="8" fill="#eaf0fd" stroke="#1d4ed8" />
  <text x="580" y="208" text-anchor="middle" font-size="12" fill="#1d4ed8">score(image, class)</text>

  <text x="720" y="208" text-anchor="middle" font-size="11" fill="#66666a">bilinear ZSL / CAST</text>

  <!-- converging arrows -->
  <path d="M580,66 L580,110 L580,150" fill="none" stroke="#66666a" stroke-width="1.4" />
  <path d="M580,146 Q580,260 500,300" fill="none" stroke="#66666a" stroke-width="1.4" marker-end="url(#arrow-bzs)" />
  <path d="M580,226 Q580,270 520,300" fill="none" stroke="#66666a" stroke-width="1.4" marker-end="url(#arrow-bzs)" />
  <path d="M580,66 Q650,220 560,300" fill="none" stroke="#66666a" stroke-width="1.2" opacity="0.6" marker-end="url(#arrow-bzs)" />

  <!-- unifying box -->
  <rect x="120" y="310" width="640" height="120" rx="10" fill="#f3f2ef" stroke="#66666a" stroke-width="1.4" />
  <text x="440" y="342" text-anchor="middle" font-size="13" font-weight="600" fill="#222">compatibility(input, target) &#8776; shared_representation(input) &#183; target_embedding</text>
  <text x="440" y="370" text-anchor="middle" font-size="12" fill="#66666a">If this is (bi)linear, swapping in an embedding for a target the model</text>
  <text x="440" y="390" text-anchor="middle" font-size="12" fill="#66666a">never trained on &#8212; a never-pulled arm, an unseen goal, an unseen class &#8212;</text>
  <text x="440" y="410" text-anchor="middle" font-size="12" fill="#66666a">still produces a usable readout. That's the zero-shot trick, for free.</text>
</svg>
