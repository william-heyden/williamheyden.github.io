<svg width="880" height="320" viewBox="0 0 880 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-ipsae" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1d4ed8" />
    </marker>
  </defs>
  <rect width="880" height="320" fill="#fafaf8" />

  <!-- inputs -->
  <rect x="30" y="40" width="180" height="60" rx="10" fill="#ffffff" stroke="#d7d6d2" />
  <text x="120" y="65" text-anchor="middle" font-size="13" fill="#222">Visual Features</text>
  <text x="120" y="82" text-anchor="middle" font-size="11" fill="#66666a">(seen classes)</text>

  <rect x="30" y="220" width="180" height="60" rx="10" fill="#ffffff" stroke="#d7d6d2" />
  <text x="120" y="245" text-anchor="middle" font-size="13" fill="#222">Semantic Attributes</text>
  <text x="120" y="262" text-anchor="middle" font-size="11" fill="#66666a">(class descriptions)</text>

  <!-- encoder -->
  <rect x="290" y="120" width="200" height="80" rx="10" fill="#eaf0fd" stroke="#1d4ed8" />
  <text x="390" y="150" text-anchor="middle" font-size="13" font-weight="600" fill="#1d4ed8">Integral Projection</text>
  <text x="390" y="168" text-anchor="middle" font-size="13" font-weight="600" fill="#1d4ed8">Encoder</text>

  <!-- latent -->
  <rect x="570" y="130" width="150" height="60" rx="10" fill="#ffffff" stroke="#d7d6d2" />
  <text x="645" y="155" text-anchor="middle" font-size="13" fill="#222">Domain-Invariant</text>
  <text x="645" y="172" text-anchor="middle" font-size="13" fill="#222">Latent Space</text>

  <!-- output -->
  <rect x="790" y="130" width="0" height="0" />

  <!-- arrows -->
  <line x1="210" y1="70" x2="290" y2="150" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrow-ipsae)" />
  <line x1="210" y1="250" x2="290" y2="175" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrow-ipsae)" />
  <line x1="490" y1="160" x2="570" y2="160" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrow-ipsae)" />

  <text x="440" y="290" text-anchor="middle" font-size="12" fill="#66666a">Reconstruction &amp; regularization mitigate domain shift and hubness for unseen-class nearest-neighbor classification</text>
</svg>
