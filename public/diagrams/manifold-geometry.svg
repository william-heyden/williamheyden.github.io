<svg width="880" height="360" viewBox="0 0 880 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-mg" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#b45309" />
    </marker>
  </defs>
  <rect width="880" height="360" fill="#fafaf8" />
  <rect x="1" y="1" width="878" height="358" fill="none" stroke="#e8e7e3" />
  <text x="20" y="28" font-size="12" fill="#66666a">ambient embedding space (high-dimensional)</text>

  <!-- the manifold -->
  <path d="M70,270 C170,120 250,320 380,190 C470,110 560,260 660,140 C710,80 770,120 800,90"
        fill="none" stroke="#1d4ed8" stroke-width="2" opacity="0.55" />
  <text x="760" y="60" font-size="12" fill="#1d4ed8" opacity="0.85">concept manifold</text>

  <!-- seen-class points on the manifold -->
  <circle cx="120" cy="212" r="7" fill="#eaf0fd" stroke="#1d4ed8" />
  <circle cx="300" cy="228" r="7" fill="#eaf0fd" stroke="#1d4ed8" />
  <circle cx="430" cy="158" r="7" fill="#eaf0fd" stroke="#1d4ed8" />
  <circle cx="560" cy="205" r="7" fill="#eaf0fd" stroke="#1d4ed8" />
  <text x="120" y="196" text-anchor="middle" font-size="11" fill="#1d4ed8">seen</text>
  <text x="560" y="189" text-anchor="middle" font-size="11" fill="#1d4ed8">seen</text>

  <!-- interpolated unseen class: close to the manifold, between two seen points -->
  <circle cx="365" cy="205" r="7" fill="#ffffff" stroke="#15803d" stroke-width="2" />
  <line x1="365" y1="205" x2="378" y2="196" stroke="#15803d" stroke-width="1.3" stroke-dasharray="3,2" />
  <text x="365" y="235" text-anchor="middle" font-size="11" fill="#15803d">unseen &#8212; interpolation</text>

  <!-- extrapolated unseen class: far from the manifold -->
  <circle cx="700" cy="270" r="7" fill="#ffffff" stroke="#b45309" stroke-width="2" />
  <line x1="700" y1="270" x2="672" y2="152" stroke="#b45309" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrow-mg)" />
  <text x="700" y="292" text-anchor="middle" font-size="11" fill="#b45309">unseen &#8212; extrapolation</text>
  <text x="770" y="230" text-anchor="middle" font-size="11" fill="#b45309">semantic extrapolation residual</text>

  <!-- hub point pulling many nearest-neighbor queries -->
  <circle cx="230" cy="320" r="8" fill="#f3f2ef" stroke="#66666a" stroke-width="2" />
  <text x="230" y="345" text-anchor="middle" font-size="11" fill="#66666a">hub point</text>
  <line x1="230" y1="320" x2="120" y2="219" stroke="#66666a" stroke-width="1" stroke-dasharray="2,2" />
  <line x1="230" y1="320" x2="300" y2="235" stroke="#66666a" stroke-width="1" stroke-dasharray="2,2" />
  <line x1="230" y1="320" x2="430" y2="165" stroke="#66666a" stroke-width="1" stroke-dasharray="2,2" />
  <line x1="230" y1="320" x2="560" y2="212" stroke="#66666a" stroke-width="1" stroke-dasharray="2,2" />
  <text x="480" y="320" text-anchor="middle" font-size="11" fill="#66666a">off-manifold point that many queries wrongly treat as their nearest neighbor</text>
</svg>
