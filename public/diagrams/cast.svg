<svg width="880" height="320" viewBox="0 0 880 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-cast" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1d4ed8" />
    </marker>
  </defs>
  <rect width="880" height="320" fill="#fafaf8" />

  <rect x="30" y="40" width="200" height="60" rx="10" fill="#ffffff" stroke="#d7d6d2" />
  <text x="130" y="65" text-anchor="middle" font-size="13" fill="#222">Pretrained Classifier</text>
  <text x="130" y="82" text-anchor="middle" font-size="11" fill="#66666a">(frozen weights)</text>

  <rect x="30" y="220" width="200" height="60" rx="10" fill="#ffffff" stroke="#d7d6d2" />
  <text x="130" y="245" text-anchor="middle" font-size="13" fill="#222">Semantic Embeddings</text>
  <text x="130" y="262" text-anchor="middle" font-size="11" fill="#66666a">(new, unseen classes)</text>

  <rect x="310" y="120" width="260" height="90" rx="10" fill="#eaf0fd" stroke="#1d4ed8" />
  <text x="440" y="150" text-anchor="middle" font-size="13" font-weight="600" fill="#1d4ed8">Closed-Form Analytic</text>
  <text x="440" y="168" text-anchor="middle" font-size="13" font-weight="600" fill="#1d4ed8">Semantic Transfer</text>
  <text x="440" y="186" text-anchor="middle" font-size="11" fill="#1d4ed8">no training · no images</text>

  <rect x="650" y="130" width="200" height="70" rx="10" fill="#ffffff" stroke="#d7d6d2" />
  <text x="750" y="158" text-anchor="middle" font-size="13" fill="#222">Extended Classifier</text>
  <text x="750" y="176" text-anchor="middle" font-size="11" fill="#66666a">(seen + unseen weights)</text>

  <line x1="230" y1="70" x2="310" y2="150" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrow-cast)" />
  <line x1="230" y1="250" x2="310" y2="180" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrow-cast)" />
  <line x1="570" y1="165" x2="650" y2="165" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrow-cast)" />

  <text x="440" y="290" text-anchor="middle" font-size="12" fill="#66666a">Weight injection extends a classifier to new classes by algebra alone — no fine-tuning, no example images</text>
</svg>
