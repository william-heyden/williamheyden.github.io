<svg width="880" height="320" viewBox="0 0 880 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-lin-a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1d4ed8" />
    </marker>
    <marker id="arrow-lin-b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#15803d" />
    </marker>
  </defs>
  <rect width="880" height="320" fill="#fafaf8" />
  <text x="20" y="28" font-size="12" fill="#66666a">a two-dimensional slice of embedding space</text>

  <!-- parallelogram points -->
  <!-- man: bottom-left, king: bottom-right, woman: top-left, queen: top-right -->
  <circle cx="220" cy="240" r="6" fill="#eaf0fd" stroke="#1d4ed8" />
  <text x="220" y="266" text-anchor="middle" font-size="13" fill="#222">man</text>

  <circle cx="580" cy="240" r="6" fill="#eaf0fd" stroke="#1d4ed8" />
  <text x="580" y="266" text-anchor="middle" font-size="13" fill="#222">king</text>

  <circle cx="220" cy="90" r="6" fill="#eaf0fd" stroke="#1d4ed8" />
  <text x="220" y="76" text-anchor="middle" font-size="13" fill="#222">woman</text>

  <circle cx="580" cy="90" r="6" fill="#eaf0fd" stroke="#1d4ed8" />
  <text x="580" y="76" text-anchor="middle" font-size="13" fill="#222">queen</text>

  <!-- royalty direction: man -> king, woman -> queen -->
  <line x1="238" y1="240" x2="562" y2="240" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrow-lin-a)" />
  <line x1="238" y1="90" x2="562" y2="90" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-lin-a)" />
  <text x="400" y="228" text-anchor="middle" font-size="11" fill="#1d4ed8">royalty direction</text>

  <!-- gender direction: man -> woman, king -> queen -->
  <line x1="220" y1="222" x2="220" y2="108" stroke="#15803d" stroke-width="2" marker-end="url(#arrow-lin-b)" />
  <line x1="580" y1="222" x2="580" y2="108" stroke="#15803d" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-lin-b)" />
  <text x="150" y="165" text-anchor="middle" font-size="11" fill="#15803d" transform="rotate(-90 150 165)">gender direction</text>

  <rect x="230" y="290" width="420" height="1" fill="none" />
  <text x="400" y="300" text-anchor="middle" font-size="13" fill="#66666a">e(king) &#8722; e(man) + e(woman) &#8776; e(queen)</text>
</svg>
