<svg width="880" height="320" viewBox="0 0 880 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-dvf" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1d4ed8" />
    </marker>
  </defs>
  <rect width="880" height="320" fill="#fafaf8" />

  <!-- Diffusion panel -->
  <text x="220" y="35" text-anchor="middle" font-size="14" font-weight="600" fill="#222">Diffusion (reverse SDE)</text>
  <circle cx="60" cy="150" r="10" fill="#66666a" />
  <text x="60" y="180" text-anchor="middle" font-size="11" fill="#66666a">noise</text>
  <circle cx="380" cy="150" r="10" fill="#1d4ed8" />
  <text x="380" y="180" text-anchor="middle" font-size="11" fill="#1d4ed8">data</text>
  <path d="M60,150 C 110,90 140,210 180,140 C 220,80 250,200 290,130 C 320,90 350,170 380,150"
        fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrow-dvf)" />
  <circle cx="110" cy="93" r="3" fill="#1d4ed8" /><circle cx="180" cy="140" r="3" fill="#1d4ed8" />
  <circle cx="250" cy="146" r="3" fill="#1d4ed8" /><circle cx="320" cy="102" r="3" fill="#1d4ed8" />
  <text x="220" y="235" text-anchor="middle" font-size="12" fill="#66666a">many small stochastic steps,</text>
  <text x="220" y="252" text-anchor="middle" font-size="12" fill="#66666a">curved probability path</text>

  <!-- divider -->
  <line x1="440" y1="50" x2="440" y2="270" stroke="#d7d6d2" stroke-width="1" />

  <!-- Flow matching panel -->
  <text x="660" y="35" text-anchor="middle" font-size="14" font-weight="600" fill="#222">Flow Matching (ODE)</text>
  <circle cx="500" cy="150" r="10" fill="#66666a" />
  <text x="500" y="180" text-anchor="middle" font-size="11" fill="#66666a">noise</text>
  <circle cx="820" cy="150" r="10" fill="#1d4ed8" />
  <text x="820" y="180" text-anchor="middle" font-size="11" fill="#1d4ed8">data</text>
  <line x1="500" y1="150" x2="820" y2="150" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrow-dvf)" />
  <circle cx="580" cy="150" r="3" fill="#1d4ed8" /><circle cx="660" cy="150" r="3" fill="#1d4ed8" />
  <circle cx="740" cy="150" r="3" fill="#1d4ed8" />
  <text x="660" y="235" text-anchor="middle" font-size="12" fill="#66666a">deterministic velocity field,</text>
  <text x="660" y="252" text-anchor="middle" font-size="12" fill="#66666a">(near-)straight path &#8594; fewer steps</text>
</svg>
