<svg width="880" height="320" viewBox="0 0 880 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-revcd" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1d4ed8" />
    </marker>
  </defs>
  <rect width="880" height="320" fill="#fafaf8" />

  <rect x="30" y="130" width="160" height="60" rx="10" fill="#ffffff" stroke="#d7d6d2" />
  <text x="110" y="165" text-anchor="middle" font-size="13" fill="#222">Visual Input</text>

  <rect x="240" y="120" width="220" height="80" rx="10" fill="#ffffff" stroke="#d7d6d2" />
  <text x="350" y="150" text-anchor="middle" font-size="13" fill="#222">Multi-Head Visual</text>
  <text x="350" y="168" text-anchor="middle" font-size="13" fill="#222">Transformer</text>
  <text x="350" y="186" text-anchor="middle" font-size="11" fill="#66666a">(attention-guided embedding)</text>

  <rect x="510" y="100" width="250" height="120" rx="10" fill="#eaf0fd" stroke="#1d4ed8" />
  <text x="635" y="130" text-anchor="middle" font-size="13" font-weight="600" fill="#1d4ed8">Reversed Conditional</text>
  <text x="635" y="148" text-anchor="middle" font-size="13" font-weight="600" fill="#1d4ed8">Diffusion</text>
  <text x="635" y="170" text-anchor="middle" font-size="11" fill="#1d4ed8">sinusoidal time schedule</text>
  <text x="635" y="186" text-anchor="middle" font-size="11" fill="#1d4ed8">Hadamard-addition embedding</text>

  <line x1="190" y1="160" x2="240" y2="160" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrow-revcd)" />
  <line x1="460" y1="160" x2="510" y2="160" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrow-revcd)" />

  <text x="440" y="270" text-anchor="middle" font-size="12" fill="#222">→ Synthesized semantic embedding → unseen-class prediction</text>
  <text x="440" y="292" text-anchor="middle" font-size="12" fill="#66666a">Reverses the usual visual-from-semantic generation direction</text>
</svg>
